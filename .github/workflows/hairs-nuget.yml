name: HAIRS NuGet Packages

# Prepares and publishes HAIRS NuGet packages (Hairs and Hairs.Cli).
# Scheme: hairs-0.1.0-preview.x
#
# Triggers:
#   - Workflow dispatch: manual trigger with input for preview number x or version override,
#     and dry_run toggle.

on:
  workflow_dispatch:
    inputs:
      preview_number:
        description: 'Preview iteration number (leave as "auto" to detect and increment from NuGet.org, or enter e.g. 1, 2, ...)'
        required: false
        default: 'auto'
      version_override:
        description: 'Exact package version (e.g. 0.1.0-preview.1). Overrides preview_number if specified.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (pack & test only, do not publish to NuGet feed)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hairs-nuget-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_OUTPUT_DIR: ${{ github.workspace }}/artifacts/nupkg

jobs:
  pack:
    name: Build, Test & Pack
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      package_version: ${{ steps.resolve-version.outputs.package_version }}
      should_publish: ${{ steps.resolve-version.outputs.should_publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve Package Version
        id: resolve-version
        shell: pwsh
        run: |
          $override = "${{ github.event.inputs.version_override }}"
          $previewInput = "${{ github.event.inputs.preview_number }}"
          $dryRun = "${{ github.event.inputs.dry_run }}"

          $baseVersion = "0.1.0"

          # Scheme: hairs-0.1.0-preview.x -> version 0.1.0-preview.x
          if ($override) {
              $version = $override
              Write-Host "Using explicit version override: $version"
          } elseif ($previewInput -and $previewInput -ne 'auto') {
              $version = "$baseVersion-preview.$previewInput"
              Write-Host "Using specified preview number: $version"
          } else {
              Write-Host "Auto-detecting next preview number from NuGet.org for package 'Hairs'..."
              $maxNumber = 0
              try {
                  $feedUri = "https://api.nuget.org/v3-flatcontainer/hairs/index.json"
                  $feed = Invoke-RestMethod -Uri $feedUri -ErrorAction Stop
                  $existing = $feed.versions | ForEach-Object {
                      if ($_ -match "^$([regex]::Escape($baseVersion))-preview\.(\d+)$") {
                          [int]$matches[1]
                      }
                  }
                  if ($existing) {
                      $maxNumber = ($existing | Measure-Object -Maximum).Maximum
                  }
                  Write-Host "Found highest published preview on NuGet.org: preview.$maxNumber"
              } catch {
                  Write-Host "Package 'Hairs' not yet on NuGet.org or feed unreachable; starting from preview.0"
              }

              $nextPreview = $maxNumber + 1
              $version = "$baseVersion-preview.$nextPreview"
              Write-Host "Auto-incremented to next preview version: $version"
          }

          $shouldPublish = ($dryRun -eq 'true') ? "false" : "true"

          Write-Host "Trigger Event: ${{ github.event_name }}"
          Write-Host "Resolved Package Version: $version"
          Write-Host "Should Publish: $shouldPublish"

          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "package_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "should_publish=$shouldPublish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build HAIRS Solution
        shell: pwsh
        run: dotnet build Hairs.slnx -c Release

      - name: Run Unit Tests
        shell: pwsh
        run: dotnet run --project tests/Hairs.Tests -c Release --no-build

      - name: Pack NuGet Packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:NUGET_OUTPUT_DIR | Out-Null
          dotnet pack Hairs.slnx -c Release --no-build `
            -p:PackageVersion=$env:PACKAGE_VERSION `
            -o $env:NUGET_OUTPUT_DIR

      - name: Verify Package Artifacts
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path "$env:NUGET_OUTPUT_DIR/*.nupkg")
          if ($packages.Count -eq 0) {
            Write-Error "No .nupkg files were generated in $env:NUGET_OUTPUT_DIR"
            exit 1
          }
          Write-Host "Generated $($packages.Count) package(s):"
          $packages | ForEach-Object {
            Write-Host " - $($_.Name) ($([math]::Round($_.Length / 1KB, 2)) KB)"
          }

      - name: Upload Packages Artifact
        uses: actions/upload-artifact@v6
        with:
          name: hairs-nuget-packages
          path: |
            ${{ env.NUGET_OUTPUT_DIR }}/*.nupkg
            ${{ env.NUGET_OUTPUT_DIR }}/*.snupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to NuGet
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: needs.pack.outputs.should_publish == 'true'
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v7
        with:
          name: hairs-nuget-packages
          path: nupkg

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) {
            Write-Error "NUGET_API_KEY secret is not set. Cannot publish to NuGet.org."
            exit 1
          }
          Write-Host "Publishing to NuGet.org..."
          dotnet nuget push "nupkg/*.nupkg" `
            --source "https://api.nuget.org/v3/index.json" `
            --api-key "$env:NUGET_API_KEY" `
            --skip-duplicate
